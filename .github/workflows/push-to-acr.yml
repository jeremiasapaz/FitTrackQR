name: Push Backend Image to Azure Container Registry

on:
  workflow_dispatch:

jobs:
  push-backend-image:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: fittrack-backend
      IMAGE_TAG: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build backend Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:$IMAGE_TAG ./backend

      - name: Push backend Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:$IMAGE_TAG